worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# 백엔드로 프록시하는 접두사 (이 표가 nginx 가 아는 경로의 전부다)
#
#   /api/          REST API                 backend ApiPaths.API
#   /oauth2/       Google 로그인 시작         backend ApiPaths.OAUTH_AUTHORIZATION
#   /login/        Google 로그인 콜백         backend ApiPaths.OAUTH_CALLBACK
#   /swagger-ui    API 문서 UI (ADMIN)       springdoc 기본값
#   /v3/           OpenAPI JSON (ADMIN)      springdoc 기본값
#   /admin         SPA 라우트, auth_request 게이트 후 index.html
#
# 백엔드 상수:   backend/src/main/java/com/jobsight/company/common/ApiPaths.java
# 프런트 상수:   frontend/src/routes.ts
# 경로를 추가하면 이 표와 위 두 파일을 함께 갱신한다.
#
# 절대 URL 은 만들지 않는다. nginx 는 컨테이너 안에서 80 을 듣지만 밖에서는 8088(또는 8443)이라
# $host / $server_port 로 조립한 URL 은 반드시 어긋난다. 리다이렉트는 상대 경로,
# 프록시 헤더는 브라우저가 보낸 Host 원본($http_host)만 넘긴다.
# ─────────────────────────────────────────────────────────────────────────────

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # 모든 프록시 블록이 같은 헤더를 넘긴다. 클라이언트가 보낸 X-Forwarded-* 는 신뢰하지 않는다.
    map $http_host $forwarded_host { default $http_host; }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 기본값(absolute_redirect on)은 Location 을 http://127.0.0.1/ 처럼 포트 없이 만든다.
        absolute_redirect off;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # 관리자 페이지 셸은 관리자 세션이 있을 때만 내려준다.
        # 실제 데이터 보호는 /api/admin/** 의 hasRole('ADMIN') 이 담당하고,
        # 이 블록은 관리자 UI 자체를 비관리자에게 노출하지 않기 위한 한 겹이다.
        location = /admin {
            auth_request /_admin_gate;
            error_page 401 403 = @admin_denied;
            try_files /index.html =404;
        }

        location @admin_denied {
            return 302 /;
        }

        location = /_admin_gate {
            internal;
            proxy_pass http://backend:8080/api/auth/admin-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location /oauth2/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location /login/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        # API 문서. 접근 제어는 백엔드 SecurityConfig(ADMIN)가 한다.
        location /swagger-ui {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location /v3/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
