name: deploy

on:
  push:
    branches: [main]

# 서버는 1대뿐이므로 배포가 겹치지 않게 직렬화한다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# permissions는 워크플로 최상단에 두지 않고 job별로 최소한만 부여한다.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.app }}
          push: true
          # ghcr 이미지 경로는 소문자만 허용 (kdHyeok -> kdhyeok)
          tags: |
            ghcr.io/kdhyeok/jobsite-v006-${{ matrix.app }}:latest
            ghcr.io/kdhyeok/jobsite-v006-${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # packages 권한 불필요: 서버가 자기 자격증명으로 GHCR에서 pull 한다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 러너를 tailnet 임시 노드로 합류시킨다. 서버는 인터넷에 열지 않는다.
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # tailnet은 WireGuard로 암호화·인증되므로 accept-new(TOFU)로 충분하다.
          # 더 엄격히 하려면 SSH_KNOWN_HOSTS secret으로 호스트키를 미리 고정한다.
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          # compose 파일은 CI가 배달한다. 서버에 git clone / repo 자격증명이 필요 없다.
          scp $SSH_OPTS compose.yaml compose.prod.yaml "$SSH_USER@$SSH_HOST:jobsite-v006/"

          # IMAGE_TAG는 commit SHA(비밀 아님)이므로 커맨드라인 전달이 안전하다.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/jobsite-v006"
          docker compose -f compose.yaml -f compose.prod.yaml pull -q backend frontend
          docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans
          docker image prune -f
          REMOTE
